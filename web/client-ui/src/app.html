<!doctype html>
<html lang="en" class="dark">
<!-- Dark default; inline script below removes the class only when user explicitly chose light. -->
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function() {
				var theme = localStorage.getItem('trasker-theme');
				if (theme === 'light') {
					document.documentElement.classList.remove('dark');
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
